[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab-agent"
version = "0.1.0"
description = "LangGraph 编排：分析 -> 验证 -> 报告 的闭环 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph>=0.2",
    "ai-lab-mcp",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-lab-agent = "ai_lab_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]