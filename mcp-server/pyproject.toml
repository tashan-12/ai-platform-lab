[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-lab-mcp"
version = "0.1.0"
description = "MCP tool server for ai-platform-lab: read_file / run_test / search_issues"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-lab-mcp = "ai_lab_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_lab_mcp"]
