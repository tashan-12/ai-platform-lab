[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab-mcp"
version = "0.1.0"
description = "MCP tool server for ai-platform-lab: read_file / run_test / search_issues"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-lab-mcp = "ai_lab_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]